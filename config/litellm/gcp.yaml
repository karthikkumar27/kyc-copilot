# GCP gateway config: Vertex AI via the Cloud Run service account (no API keys).
# Keep VERTEX_LOCATION in your residency region where the model is offered there.
model_list:
  - model_name: chat-default
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION
  - model_name: chat-fallback
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION
    # Claude is also available on Vertex AI Model Garden; add it here once enabled in your project.
  - model_name: embed-default
    litellm_params:
      model: vertex_ai/gemini-embedding-001
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION

router_settings:
  num_retries: 2
  timeout: 30
  fallbacks:
    - chat-default: ["chat-fallback"]

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
