[project]
name = "kyc-copilot"
version = "0.1.0"
description = "Production-grade RAG support copilot for e-KYC operations (fictional e-wallet: LimauPay)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "openai>=1.40",
  "httpx>=0.27",
  "arq>=0.26",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "pytesseract>=0.3.10",
  "pdf2image>=1.17",
  "pillow>=10.3",
  "presidio-analyzer>=2.2.354",
  "presidio-anonymizer>=2.2.354",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-storage>=2.17",
  "google-cloud-documentai>=2.29",
  "google-cloud-dlp>=3.18",
  "google-cloud-tasks>=2.16",
]
# Placeholders: fill in when the AWS / Azure adapters are implemented.
aws = []    # e.g. boto3 (S3, SQS, Textract, Comprehend)
azure = []  # e.g. azure-storage-blob, azure-ai-documentintelligence, azure-ai-textanalytics
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]
